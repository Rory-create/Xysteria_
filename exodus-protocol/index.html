<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exodus Protocol</title>
  <link rel="stylesheet" href="css/game.css?v=0.0.3">
</head>
<body>

<!-- ===== MENU SCREEN ===== -->
<div id="screen-menu">
  <canvas id="menu-canvas"></canvas>
  <div class="menu-content">
    <div class="menu-title">Exodus Protocol</div>
    <div class="menu-subtitle">An interstellar colony survival game</div>
    <div class="menu-version">v0.0.3</div>
    <button class="menu-btn primary" id="btn-new-run">Begin New Run</button>
    <button class="menu-btn" id="btn-continue" style="display:none">Continue Run</button>
    <button class="menu-btn vault" id="btn-vault">⬡ Legacy Vault</button>
    <div id="menu-stats"></div>
  </div>
</div>

<!-- ===== LEGACY VAULT SCREEN ===== -->
<div id="screen-vault" style="display:none">
  <h2>⬡ Legacy Vault</h2>
  <p style="color:var(--text-dim);font-size:12px">
    Spend Legacy Points earned across runs on permanent upgrades that carry into all future runs.
  </p>
  <div id="vault-container"></div>
  <button class="menu-btn back" id="btn-vault-back">← Back to Menu</button>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="screen-game" style="display:none">

  <!-- Background canvas (starfield / planet art) -->
  <canvas id="bg-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%"></canvas>

  <!-- Phase indicator top bar -->
  <div id="phase-indicator">Phase 1: The Crossing</div>

  <!-- Left: HUD -->
  <aside id="hud"></aside>

  <!-- Center: Narrative -->
  <main id="narrative-area">
    <div id="narrative"></div>
  </main>

  <!-- Right: Planet panel (Phase 1) / Build+Tech panels (Phase 2) -->
  <aside id="planet-panel">
    <div style="color:var(--text-dim);font-size:11px;padding:8px 0">
      Planet data will appear here when you detect a world.
    </div>
  </aside>
  <aside id="build-panel"></aside>
  <aside id="tech-panel"></aside>

  <!-- Center bottom: Choices -->
  <div id="choices-area">
    <div id="choices"></div>
  </div>

  <!-- Bottom bar (Phase 2 tabs) — hidden in Phase 1 -->
  <div id="bottom-bar" style="display:none">
    <button class="tab-btn active" id="tab-build" onclick="switchTab('build')">🏗 Build</button>
    <button class="tab-btn" id="tab-tech"  onclick="switchTab('tech')">🔬 Research</button>
  </div>

</div>

<!-- ===== SCRIPTS (order matters) ===== -->
<!-- Data -->
<script src="js/data/events_crossing.js?v=0.0.3"></script>
<script src="js/data/events_landfall.js?v=0.0.3"></script>
<script src="js/data/tech_tree_base.js?v=0.0.3"></script>
<script src="js/data/tech_tree_relics.js?v=0.0.3"></script>
<script src="js/data/building_defs.js?v=0.0.3"></script>

<!-- Engine -->
<script src="js/ship.js?v=0.0.3"></script>
<script src="js/planet.js?v=0.0.3"></script>
<script src="js/tech.js?v=0.0.3"></script>
<script src="js/meta.js?v=0.0.3"></script>
<script src="js/events.js?v=0.0.3"></script>
<script src="js/renderer.js?v=0.0.3"></script>
<script src="js/ui.js?v=0.0.3"></script>
<script src="js/phase1.js?v=0.0.3"></script>
<script src="js/phase2.js?v=0.0.3"></script>
<script src="js/main.js?v=0.0.3"></script>

<!-- Tab switching for Phase 2 -->
<script>
function switchTab(name) {
  document.getElementById('build-panel').style.display = name === 'build' ? 'block' : 'none';
  document.getElementById('tech-panel').style.display  = name === 'tech'  ? 'block' : 'none';
  document.getElementById('planet-panel').style.display = 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

// Show bottom bar and switch panels when Phase 2 starts
// Phase2 calls UI.setPhaseIndicator which triggers this
const _origSetPhase = UI.setPhaseIndicator.bind(UI);
// We wire up Phase 2 panel visibility from phase2.js showLandingNarrative
document.addEventListener('DOMContentLoaded', () => {
  // Watch for phase 2 start via MutationObserver on phase-indicator
  const phaseEl = document.getElementById('phase-indicator');
  if (!phaseEl) return;
  const obs = new MutationObserver(() => {
    const isPhase2 = phaseEl.textContent.includes('Phase 2');
    const bottomBar = document.getElementById('bottom-bar');
    const planetPanel = document.getElementById('planet-panel');
    const buildPanel = document.getElementById('build-panel');
    const techPanel = document.getElementById('tech-panel');
    if (isPhase2) {
      if (bottomBar) bottomBar.style.display = 'flex';
      if (planetPanel) planetPanel.style.display = 'none';
      if (buildPanel) { buildPanel.style.display = 'block'; }
      if (techPanel)  { techPanel.style.display  = 'none'; }
    } else {
      if (bottomBar) bottomBar.style.display = 'none';
      if (planetPanel) planetPanel.style.display = 'block';
      if (buildPanel) buildPanel.style.display = 'none';
      if (techPanel)  techPanel.style.display  = 'none';
    }
  });
  obs.observe(phaseEl, { childList: true, characterData: true, subtree: true });
});
</script>
</body>
</html>
